<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17" />
      <stop offset="100%" stop-color="#162238" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="8" />

  <!-- Inner subtle glow -->
  <circle cx="256" cy="256" r="190" fill="#0284c7" opacity="0.08" />

  <!-- Graduation Cap Top Diamond -->
  <polygon points="256,120 410,195 256,270 102,195" fill="url(#cyanGrad)" />
  
  <!-- Graduation Cap Under Skullcap -->
  <path d="M165,225 L165,285 C165,335 347,335 347,285 L347,225 L256,270 Z" fill="#0369a1" />

  <!-- Tassel Cord & Hanging Drop -->
  <path d="M380,200 L410,265 L418,310" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" fill="none" />
  <circle cx="418" cy="315" r="10" fill="url(#goldGrad)" />

  <!-- Play Triangle & Solution Symbol inside lower badge -->
  <polygon points="230,345 305,390 230,435" fill="url(#goldGrad)" />
</svg>
